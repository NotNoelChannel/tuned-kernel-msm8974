name: Kernel CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v3

    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y lib32z1 ccache autoconf git zip
        git clone --depth 1 --branch android-6.0.1_r11 --single-branch https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-eabi-4.8 /opt/toolchains/arm-eabi-4.8/

    - name: Configure Build Parameters
      run: |
        export ARCH=arm
        export CROSS_COMPILE=/opt/toolchains/arm-eabi-4.8/bin/arm-eabi-
        bash bbuild-anykernel.sh klte
    - name: Uploading Kernel 
      run: |
        cp out/arch/arm/boot/zImage /home/runner/work/output/
        cp out/arch/arm/boot/dt.img /home/runner/work/output/
    - name: Upload Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: zImage
        path: /home/runner/work/output/zImage
    - name: Upload Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dtb
        path: /home/runner/work/output/dt.img
